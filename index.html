<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil — Asso Étudiante</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">Campus Hub</a>
      <nav>
        <ul>
          <li><a href="index.html" class="active">Accueil</a></li>
          <li><a href="events.html">Événements</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1>Inscription aux événements</h1>

    <p class="description">
      Remplissez le formulaire pour participer
      à l'un de nos événements.
    </p>

    <form id="registrationForm">

      <div class="form-group">
        <label for="nom">Nom *</label>
        <input type="text" id="nom" name="nom" autocomplete="family-name" required>
      </div>

      <div class="form-group">
        <label for="prenom">Prénom *</label>
        <input type="text" id="prenom" name="prenom" autocomplete="given-name" required>
      </div>

      <div class="form-group">
        <label for="email">Adresse e-mail *</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="telephone">Téléphone</label>
        <input type="tel" id="telephone" name="telephone" autocomplete="tel">
      </div>

      <div class="form-group">
        <label for="evenement">Événement *</label>
        <select id="evenement" name="evenement" required>
          <option value="">-- Choisir un événement --</option>
          <option value="conference">Conférence Tech</option>
          <option value="hackathon">Hackathon étudiant</option>
          <option value="workshop">Atelier développement web</option>
        </select>
      </div>

      <button type="submit">
        S'inscrire
      </button>

      <p id="message" class="message" role="status" aria-live="polite"></p>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Campus Hub — Tous droits réservés.</p>
  </footer>

  <script src="js/script.js"></script>
</body>

</html>
